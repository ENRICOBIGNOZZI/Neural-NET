name: CI

on:
  push:
    branches: [main, research/safe-spectral-reduction]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Unit tests
        run: pytest -q
      - name: Fixed-geometry theorem audit
        run: python experiments/run_fixed_geometry_audit.py
      - name: Small quadratic-onset smoke audit
        run: python experiments/run_quadratic_onset_audit.py --dims 30 50 --seeds 2 --theta 3.0 --gamma 0.6
