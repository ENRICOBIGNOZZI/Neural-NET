name: Non-oracle controller confirmation

on:
  push:
    branches: [research/safe-spectral-reduction]

jobs:
  controller-sweep:
    if: contains(github.event.head_commit.message, '[nonoracle-controller-confirm]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        wide_factors: [24, 30, 36, 42, 48]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run frozen target-free controller confirmation
        run: >-
          python experiments/run_nonoracle_controller_confirm.py
          --seeds 300 301 302 303 304 305 306 307 308 309 310 311 312 313 314 315 316 317 318 319 320 321 322 323 324 325 326 327 328 329 330 331 332 333 334 335 336 337 338 339 340 341 342 343 344 345 346 347 348 349
          --dimension 24
          --wide-factors ${{ matrix.wide_factors }}
          --teacher-rank 12
          --theta 1.0
          --learning-rate 0.005
          --batch-size 256
          --horizon-steps 40
          --checkpoints 20 40 60 80 100 120
          --noise-std 0.0
          --output results/nonoracle_controller_confirm_${{ matrix.wide_factors }}.json
      - name: Upload architecture result
        uses: actions/upload-artifact@v4
        with:
          name: nonoracle-controller-confirm-${{ matrix.wide_factors }}
          path: results/nonoracle_controller_confirm_${{ matrix.wide_factors }}.json

  aggregate:
    if: contains(github.event.head_commit.message, '[nonoracle-controller-confirm]')
    needs: controller-sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nonoracle-controller-confirm-*
          path: results/parts
          merge-multiple: true
      - name: Aggregate frozen policy family
        run: >-
          python experiments/aggregate_nonoracle_controller_confirm.py
          --inputs
          results/parts/nonoracle_controller_confirm_24.json
          results/parts/nonoracle_controller_confirm_30.json
          results/parts/nonoracle_controller_confirm_36.json
          results/parts/nonoracle_controller_confirm_42.json
          results/parts/nonoracle_controller_confirm_48.json
          --output results/nonoracle_controller_confirmatory.json
      - name: Upload aggregate
        uses: actions/upload-artifact@v4
        with:
          name: nonoracle-controller-confirmatory
          path: results/nonoracle_controller_confirmatory.json
