name: Rank-factor value audit

on:
  push:
    branches: [research/safe-spectral-reduction]

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[rank-audit]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run rank-factor counterfactual audit
        run: |
          python experiments/run_rank_factor_value_audit.py --dataset digits --seed 0
          python experiments/run_rank_factor_value_audit.py --dataset digits --seed 1
          python experiments/run_rank_factor_value_audit.py --dataset cancer --seed 0
          python experiments/run_rank_factor_value_audit.py --dataset cancer --seed 1
          python experiments/analyze_rank_factor_value_audit.py
      - name: Upload rank-factor audit
        uses: actions/upload-artifact@v4
        with:
          name: rank-factor-value-audit
          path: results/rank_factor_audit_*.json
