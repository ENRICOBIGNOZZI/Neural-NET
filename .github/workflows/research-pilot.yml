name: Research pilot

on:
  push:
    branches: [research/safe-spectral-reduction]

jobs:
  pilot:
    if: contains(github.event.head_commit.message, '[pilot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run quadratic onset audit
        run: python experiments/run_quadratic_onset_audit.py --dims 32 64 128 256 --seeds 12 --theta 1.0 --gamma 0.5
      - name: Run real-data pilot suite
        run: python experiments/run_pilot_suite.py
      - name: Upload research results
        uses: actions/upload-artifact@v4
        with:
          name: research-pilot-results
          path: results/
