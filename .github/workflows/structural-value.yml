name: Structural value audit

on:
  push:
    branches: [research/safe-spectral-reduction]

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[structural]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Collect paired finite-horizon structural damage
        run: python experiments/collect_structural_value_transitions.py
      - name: Forecast structural damage from current state
        run: python experiments/analyze_structural_value_transitions.py
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: structural-value-audit
          path: results/structural_value_*.json
