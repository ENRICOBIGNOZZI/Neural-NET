name: Physical architecture frontier

on:
  push:
    branches: [research/safe-spectral-reduction]

jobs:
  rank-sweep:
    if: contains(github.event.head_commit.message, '[architecture-frontier-confirm]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        wide_factors: [24, 30, 36, 42, 48]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run frozen architecture cell family
        run: >-
          python experiments/run_physical_architecture_frontier.py
          --seeds 200 201 202 203 204 205 206 207 208 209 210 211 212 213 214 215 216 217 218 219 220 221 222 223 224 225 226 227 228 229 230 231 232 233 234 235 236 237 238 239 240 241 242 243 244 245 246 247 248 249
          --dimension 24
          --wide-factors ${{ matrix.wide_factors }}
          --teacher-rank 12
          --theta 1.0
          --learning-rate 0.005
          --batch-size 256
          --horizon-steps 40
          --checkpoints 20 40 60 80 100 120
          --noise-std 0.0
          --alpha 0.05
          --simultaneous-tests 30
          --output results/frontier_rank_${{ matrix.wide_factors }}.json
      - name: Upload rank result
        uses: actions/upload-artifact@v4
        with:
          name: frontier-rank-${{ matrix.wide_factors }}
          path: results/frontier_rank_${{ matrix.wide_factors }}.json

  aggregate:
    if: contains(github.event.head_commit.message, '[architecture-frontier-confirm]')
    needs: rank-sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download rank artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: frontier-rank-*
          path: results/parts
          merge-multiple: true
      - name: Aggregate frozen 30-cell family
        run: >-
          python experiments/aggregate_physical_architecture_frontier.py
          --inputs
          results/parts/frontier_rank_24.json
          results/parts/frontier_rank_30.json
          results/parts/frontier_rank_36.json
          results/parts/frontier_rank_42.json
          results/parts/frontier_rank_48.json
          --output results/physical_architecture_frontier.json
      - name: Upload aggregate
        uses: actions/upload-artifact@v4
        with:
          name: physical-architecture-frontier-confirmatory
          path: results/physical_architecture_frontier.json
